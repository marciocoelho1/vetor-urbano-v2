spring.application.name=vetor-urbano-api
spring.profiles.default=local

server.address=127.0.0.1
server.port=8080

spring.datasource.url=${VETOR_DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/vetor_urbano}
spring.datasource.username=${VETOR_DATABASE_USERNAME:postgres}
spring.datasource.password=${VETOR_DATABASE_PASSWORD:}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.data-source-properties.socketTimeout=3
spring.jdbc.template.query-timeout=5

vetor.accounts.enabled=false
vetor.accounts.token-ttl=15m
vetor.accounts.resend-cooldown=60s
vetor.accounts.resends-per-hour=3
vetor.accounts.requests-per-minute=30
vetor.accounts.mailbox-port=8025
vetor.accounts.password-iterations=600000
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Ticket 14: parâmetros reversíveis apenas para desenvolvimento sintético.
vetor.auth.inactivity=1h
vetor.auth.lifetime=12h
vetor.auth.partial-lifetime=5m
vetor.auth.login-attempts=10
vetor.auth.mfa-attempts=5
vetor.auth.global-attempts=60
vetor.auth.secure-cookie=false

# Ticket 22: antecedência explícita para confirmações «próximas de expirar». Em branco, o painel
# responde NOT_CONFIGURED e não sugere prazo algum. Prazos por tipo continuam os aprovados no 25.
vetor.operations.expiry-window=24h
