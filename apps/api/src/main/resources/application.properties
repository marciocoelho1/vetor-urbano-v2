spring.application.name=vetor-urbano-api
spring.profiles.default=local

server.address=127.0.0.1
server.port=8080

spring.datasource.url=${VETOR_DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/vetor_urbano}
spring.datasource.username=${VETOR_DATABASE_USERNAME:postgres}
spring.datasource.password=${VETOR_DATABASE_PASSWORD:}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.data-source-properties.socketTimeout=3
spring.jdbc.template.query-timeout=5
